behaviors:
  airplaneTerrain:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      # Wider than the prototype: the three ray sensors add ~396 observations on top of
      # the 20 vector ones, and 128 units struggles to use that much input.
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 1000000000
    keep_checkpoints: 30
    checkpoint_interval: 250000
    time_horizon: 128
    summary_freq: 250000
